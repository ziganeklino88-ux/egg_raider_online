<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>EGG RAIDERS 3D — Ultra Edition</title>
<style>
:root{--bg:#07101d;--panel:rgba(8,16,31,.82);--line:rgba(255,255,255,.12);--accent:#7c5cff;--cyan:#28d8ff;--gold:#ffd45a}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050a12;color:#fff;font-family:Inter,system-ui,Arial,sans-serif}
canvas{display:block}button,input{font:inherit}button{border:0;color:#fff;cursor:pointer;font-weight:800}
#game{position:fixed;inset:0}
#loading{position:fixed;inset:0;z-index:999;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#182b52,#050a12 65%);transition:opacity .5s}
.loader{text-align:center}.logo{font-size:clamp(34px,7vw,72px);font-weight:1000;letter-spacing:-3px;text-shadow:0 8px 35px #000}.logo span{color:#7c5cff}.loadline{width:min(360px,80vw);height:8px;background:#1a2740;border-radius:20px;overflow:hidden;margin:20px auto}.loadline i{display:block;height:100%;width:40%;background:linear-gradient(90deg,#7c5cff,#28d8ff);animation:load 1.1s infinite alternate}@keyframes load{to{width:100%;transform:translateX(0)}}
#menu{position:fixed;inset:0;z-index:500;display:none;place-items:center;background:linear-gradient(180deg,rgba(2,6,15,.35),rgba(2,6,15,.78));backdrop-filter:blur(4px)}
.menuBox{width:min(720px,94vw);padding:34px;text-align:center}.menuBox h1{font-size:clamp(42px,8vw,78px);line-height:.9;margin:0 0 12px;letter-spacing:-4px}.menuBox h1 b{color:#7c5cff}.tag{color:#9db0cd;margin-bottom:26px}.menuBtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:500px;margin:auto}.bigBtn{padding:16px 18px;border-radius:16px;background:linear-gradient(135deg,#7359ff,#397dff);box-shadow:0 10px 30px rgba(74,88,255,.25);font-size:16px}.bigBtn.alt{background:#14223a}.nameInput{width:min(320px,90%);padding:13px 15px;border-radius:12px;border:1px solid var(--line);background:#0b1527;color:#fff;outline:none;margin-bottom:12px;text-align:center}
#hud{position:fixed;inset:0;z-index:20;pointer-events:none;display:none}
.top{position:absolute;left:14px;right:14px;top:12px;display:flex;gap:10px;align-items:center}.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:9px 13px;backdrop-filter:blur(12px);box-shadow:0 8px 30px #0003}.stat small{display:block;color:#8195b5;font-size:10px;font-weight:900;letter-spacing:.8px}.stat strong{font-size:17px}.levelStat{flex:1;min-width:150px}.xp{height:7px;border-radius:20px;background:#1c2940;margin-top:5px;overflow:hidden}.xp i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7c5cff,#28d8ff);box-shadow:0 0 12px #28d8ff}
#right{position:absolute;right:14px;top:82px;display:flex;flex-direction:column;gap:8px;pointer-events:auto}.hbtn{padding:11px 13px;border-radius:13px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(12px);min-width:120px;text-align:left}.hbtn:hover{background:#182741}.admin{background:linear-gradient(135deg,#8b243e,#bd4d69)!important}
#bottom{position:absolute;left:50%;bottom:15px;transform:translateX(-50%);display:flex;gap:8px;pointer-events:auto}.pill{background:var(--panel);border:1px solid var(--line);padding:9px 14px;border-radius:99px;color:#b9c8df;font-size:12px}
#toast{position:fixed;z-index:900;left:50%;top:88px;transform:translate(-50%,-15px);opacity:0;pointer-events:none;background:#0d192c;border:1px solid #345071;padding:12px 18px;border-radius:14px;font-weight:900;box-shadow:0 14px 35px #0006;transition:.25s}#toast.show{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;z-index:700;display:none;place-items:center;background:#0008;padding:16px}.modal.show{display:grid}.window{width:min(960px,96vw);max-height:88vh;overflow:auto;padding:24px;border-radius:22px;background:rgba(7,14,28,.95);border:1px solid var(--line);box-shadow:0 25px 80px #0009}.window h2{margin:0 0 18px;font-size:27px}.close{float:right;background:#18263d;border-radius:10px;padding:8px 11px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.card{background:#0d192c;border:1px solid #233653;border-radius:16px;padding:15px}.card h3{margin:0 0 7px}.muted{color:#8499b8;font-size:12px}.card button{margin-top:10px;width:100%;padding:10px;border-radius:10px;background:linear-gradient(135deg,#6d55ff,#367cff)}.card button:disabled{opacity:.4;cursor:not-allowed}.rarity{font-weight:900}.common{color:#b9c5d6}.rare{color:#43baff}.epic{color:#bf6cff}.legendary{color:#ffd34f}.mythic{color:#ff5ca8}.divine{color:#55ffe0}.secret{color:#fff;text-shadow:0 0 12px #ff5df0}
#mobile{display:none;position:fixed;inset:0;z-index:25;pointer-events:none}.stick{position:absolute;left:20px;bottom:25px;width:138px;height:138px;border-radius:50%;background:#ffffff12;border:1px solid #ffffff18;pointer-events:auto}.knob{position:absolute;left:39px;top:39px;width:60px;height:60px;border-radius:50%;background:#765dffcc}.touches{position:absolute;right:18px;bottom:25px;display:flex;gap:10px;pointer-events:auto}.touch{width:62px;height:62px;border-radius:50%;background:#13243cdd;border:1px solid #ffffff18}
#hatch{position:fixed;inset:0;z-index:800;display:none;place-items:center;background:radial-gradient(circle,#192d55aa,#030712ee)}#hatch.show{display:grid}.hatchBox{text-align:center}.bigEgg{font-size:130px;filter:drop-shadow(0 0 30px #7c5cff);animation:eggshake .18s infinite alternate}.bigEgg.crack{animation:crack .45s forwards}@keyframes eggshake{to{transform:rotate(7deg) scale(1.06)}}@keyframes crack{to{transform:scale(1.4) rotate(20deg);opacity:0}}.reveal{font-size:95px;animation:pop .5s cubic-bezier(.2,1.6,.3,1)}@keyframes pop{from{transform:scale(.1);opacity:0}to{transform:scale(1);opacity:1}}
@media(max-width:720px){.menuBtns{grid-template-columns:1fr}.stat{padding:7px 9px}.stat strong{font-size:14px}.stat small{font-size:8px}.top{left:7px;right:7px}.levelStat{min-width:105px}#right{right:7px;top:72px}.hbtn{min-width:96px;padding:9px;font-size:12px}.pill{font-size:10px}#mobile{display:block}.window{padding:16px}}

#announcement{position:fixed;top:78px;left:50%;transform:translate(-50%,-20px);z-index:120;display:none;max-width:min(760px,92vw);padding:14px 22px;border:1px solid rgba(255,212,90,.55);border-radius:16px;background:linear-gradient(135deg,rgba(35,25,5,.96),rgba(12,18,32,.96));box-shadow:0 14px 45px rgba(0,0,0,.45);text-align:center;pointer-events:none}#announcement.show{display:block;animation:announceIn .35s ease}@keyframes announceIn{from{opacity:0;transform:translate(-50%,-35px)}to{opacity:1;transform:translate(-50%,0)}}

#playerList .playerOnline{color:#58f28a}.playerOffline{color:#ff7f7f}.playerRowOnline,.playerRowOffline{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:12px;margin:6px 0;background:#0b1424;border:1px solid #263854}.playerRowOnline{border-color:#1d6b43}.playerRowOffline{opacity:.72;border-color:#63353b}.statusDot{font-size:12px;font-weight:900}.playerMeta{font-size:12px;color:#8fa1bb}.playerMe{border-color:#7c5cff!important;box-shadow:0 0 0 1px #7c5cff33}
</style>
</head>
<body>
<div id="loading"><div class="loader"><div class="logo">EGG <span>RAIDERS</span> 3D</div><p>Ultra Edition wird geladen...</p><div class="loadline"><i></i></div></div></div>
<div id="game"></div>

<div id="menu">
 <div class="menuBox">
  <h1>EGG <b>RAIDERS</b><br>3D</h1>
  <div class="tag">Collect · Hatch · Mutate · Explore</div>
  <input class="nameInput" id="menuName" maxlength="18" placeholder="Spielername">
  <div class="menuBtns">
   <button class="bigBtn" onclick="startGame()">▶ SPIELEN</button>
   <button class="bigBtn alt" onclick="openHelp()">❓ ANLEITUNG</button>
  </div>
  <p class="muted">Kein Stehlen · Kein Bauen · Dein Fortschritt gehört dir.</p>
 </div>
</div>

<div id="hud">
 <div class="top">
  <div class="stat"><small>COINS</small><strong id="coins">0</strong></div>
  <div class="stat"><small>LEVEL</small><strong id="level">1</strong></div>
  <div class="stat levelStat"><small>XP <span id="xpText">0/100</span></small><div class="xp"><i id="xpBar"></i></div></div>
 </div>
 <div id="right">
  <button class="hbtn" onclick="openEggs()">🥚 Eggs</button>
  <button class="hbtn" onclick="openCollection()">🧠 Sammlung</button>
  <button class="hbtn" onclick="openShop()">⚡ Shop</button>
  <button class="hbtn" onclick="openQuests()">🎯 Quests</button>
  <button class="hbtn" onclick="openDaily()">🎁 Daily</button>
  <button class="hbtn" onclick="openAchievements()">🏆 Achievements</button>
  <button class="hbtn" onclick="openMap()">🗺️ Welt</button>
  <button class="hbtn" onclick="openSettings()">⚙️</button>
  <button class="hbtn admin" id="adminBtn" onclick="openAdmin()" style="display:none">👑 Admin</button>
 </div>
 <div id="bottom"><div class="pill">WASD · Maus · Shift</div><div class="pill">E = nächstes Egg</div></div>
</div>

<div id="mobile"><div class="stick" id="stick"><div class="knob" id="knob"></div></div><div class="touches"><button class="touch" id="interact">E</button><button class="touch" id="run">⚡</button></div></div>
<div id="toast"></div><div id="announcement"></div>
<div id="modal" class="modal"><div class="window" id="window"></div></div>
<div id="hatch"><div class="hatchBox" id="hatchBox"></div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
"use strict";

/* ============================================================
   EGG RAIDERS 3D — ULTRA SINGLE FILE
   Everything lives in this HTML file. No building/stealing system.
   ============================================================ */

const $=id=>document.getElementById(id);
const SAVE="eggRaidersUltraSaveV3";
const defaultState={
 name:"Player",coins:2500,level:1,xp:0,speedLevel:1,
 collection:[],mutations:[],unlocked:["Starter Island"],quests:{},
 achievements:{},dailyStreak:0,lastDaily:"",settings:{music:true,shadows:true,inputMode:"keyboard"},pendingGifts:{},announcements:[],
 totalHatches:0,totalCoins:0,discoveredZones:1
};
let state={...defaultState};
try{const s=JSON.parse(localStorage.getItem(SAVE)||"null");if(s)state=Object.assign(state,s)}catch(e){}

const mutations=[
 {name:"Normal",mult:1,color:0xffffff,chance:.70},
 {name:"Golden",mult:2.5,color:0xffd34d,chance:.10},
 {name:"Diamond",mult:7,color:0x67eaff,chance:.06},
 {name:"Rainbow",mult:18,color:0xff5de7,chance:.04},
 {name:"Neon",mult:10,color:0x53ff91,chance:.035},
 {name:"Shadow",mult:14,color:0x30303c,chance:.025},
 {name:"Galaxy",mult:25,color:0x9b75ff,chance:.018},
 {name:"Cosmic",mult:40,color:0x43eaff,chance:.01},
 {name:"Secret Mutation",mult:75,color:0xff4b7d,chance:.002}
];
const eggs=[
 {name:"Basic Egg",zone:"Starter Island",req:1,cost:100,color:0x6ea6ff,pets:[["Bubblo","Common",10],["Mimi","Rare",25],["Pixel Pup","Epic",60],["Star Nibbler","Legendary",180]]},
 {name:"Forest Egg",zone:"Green Forest",req:11,cost:650,color:0x46d87a,pets:[["Mossy","Common",15],["Leafy","Rare",40],["Woodoo","Epic",90],["Forest King","Legendary",260]]},
 {name:"Desert Egg",zone:"Desert",req:11,cost:1800,color:0xf2bd52,pets:[["Duney","Common",25],["Scorpy","Rare",65],["Sun Fox","Epic",150],["Golden Sphinx","Legendary",450]]},
 {name:"Ocean Egg",zone:"Ocean",req:26,cost:6000,color:0x31d7ef,pets:[["Bloop","Common",50],["Coraly","Rare",120],["Aqua Rex","Epic",300],["Tide Lord","Legendary",800]]},
 {name:"Crystal Egg",zone:"Crystal Cave",req:26,cost:18000,color:0xd16fff,pets:[["Pebblix","Common",90],["Gemlet","Rare",220],["Prismoo","Epic",600],["Crystal Titan","Legendary",1500]]},
 {name:"Volcano Egg",zone:"Volcano",req:51,cost:55000,color:0xff603f,pets:[["Ember","Common",150],["Magmax","Rare",400],["Lava Lynx","Epic",1000],["Inferno Dragon","Legendary",3000]]},
 {name:"Galaxy Egg",zone:"Space Zone",req:51,cost:160000,color:0x9872ff,pets:[["Cosmi","Common",300],["Nebulon","Rare",900],["Astro Cat","Epic",2500],["Galaxy Beast","Legendary",7000]]},
 {name:"Ancient Egg",zone:"Ancient Zone",req:100,cost:500000,color:0xffd268,pets:[["Runi","Rare",900],["Sphinx Pup","Epic",3000],["Ancient Rex","Legendary",10000],["Time King","Mythic",30000]]},
 {name:"Secret Egg",zone:"Secret Zone",req:150,cost:2500000,color:0xff4fd8,pets:[["???","Mythic",8000],["Voidling","Divine",30000],["Secret Beast","Secret",100000],["Cosmic One","Secret",250000]]}
];
const zones=[
 ["Starter Island",0,0,0x4b9b63,1,"🌱"],["Green Forest",-56,0,0x2e8148,11,"🌲"],
 ["Desert",56,0,0xc99a49,11,"🏜️"],["Ocean",0,-58,0x237ea5,26,"🌊"],
 ["Crystal Cave",0,58,0x67418d,26,"💎"],["Volcano",-82,-55,0xa84438,51,"🌋"],
 ["Space Zone",82,55,0x30376f,51,"🚀"],["Ancient Zone",96,-62,0x826241,100,"🏛️"],
 ["Secret Zone",-102,65,0x22263d,150,"❓"]
];

let scene,camera,renderer,clock,player;
let yaw=0,pitch=-.28,keys={},joy={x:0,y:0},world=[],pets3D=[],eggObjects=[];
let started=false,day=0;
const v=new THREE.Vector3();

function save(){localStorage.setItem(SAVE,JSON.stringify(state))}
function fmt(n){return Math.floor(n).toLocaleString("de-CH")}
function need(){return 100+state.level*80}
function income(){return state.collection.reduce((a,p)=>a+(p.value||0),0)}
function toast(t){$("toast").textContent=t;$("toast").classList.add("show");clearTimeout(toast.timer);toast.timer=setTimeout(()=>$("toast").classList.remove("show"),2200)}
function ui(){
 $("coins").textContent=fmt(state.coins);
 $("level").textContent=state.level;
 $("xpText").textContent=fmt(state.xp)+"/"+fmt(need());
 $("xpBar").style.width=Math.min(100,state.xp/need()*100)+"%";
 $("adminBtn").style.display=state.name==="LinoA"?"block":"none";
}
function addXP(n,admin=false){
 n=Math.max(0,Math.floor(admin?n:n*0.25));
 state.xp+=n;
 let leveled=false;
 while(state.xp>=need()){state.xp-=need();state.level++;leveled=true;unlockZones()}
 if(leveled){toast("✨ LEVEL UP! Du bist jetzt Level "+state.level);burst(player?.position,0x7c5cff,35)}
 save();ui();
}
function unlockZones(){
 zones.forEach(z=>{if(state.level>=z[4]&&!state.unlocked.includes(z[0])){state.unlocked.push(z[0]);state.discoveredZones++;toast("🗺️ "+z[5]+" "+z[0]+" freigeschaltet!");burst(new THREE.Vector3(z[1],2,z[2]),0x28d8ff,50)}})
}
function startGame(){
 const n=$("menuName").value.trim();if(n)state.name=n;
 save();started=true;$("menu").style.display="none";$("hud").style.display="block";applyInputMode();ui();
 if(player){player.position.set(0,0,18)}
 claimGifts();
 toast("Willkommen, "+state.name+"! 🥚");
}
/* ================= ONLINE PLAYER LIST ================= */
let onlineSocket=null;
let onlinePlayers=[];
let playerServerReady=false;
let serverPlayerId=null;
function wsUrl(){const proto=location.protocol==="https:"?"wss:":"ws:";return proto+"//"+location.host;}
function connectPresence(){
  if(!location.host || location.protocol==="file:") return;
  try{
    onlineSocket=new WebSocket(wsUrl());
    onlineSocket.onopen=()=>{playerServerReady=true;onlineSocket.send(JSON.stringify({type:"join",name:state.name}));renderPlayerList();};
    onlineSocket.onmessage=e=>{try{const msg=JSON.parse(e.data);if(msg.type==="presence"){onlinePlayers=msg.players||[];serverPlayerId=msg.id||serverPlayerId;renderPlayerList();}if(msg.type==="announcement"&&msg.text)showAnnouncement(msg.text);}catch(err){}};
    onlineSocket.onclose=()=>{playerServerReady=false;renderPlayerList();setTimeout(connectPresence,4000);};
    onlineSocket.onerror=()=>{};
  }catch(err){}
}
function sendPresence(){if(onlineSocket?.readyState===1)onlineSocket.send(JSON.stringify({type:"update",name:state.name}));}
function renderPlayerList(){const online=(onlinePlayers||[]).filter(p=>p.online);$("onlineCount").textContent=online.length||1;}
function openPlayerList(){
  const rows=(onlinePlayers||[]).slice().sort((a,b)=>{if(a.online!==b.online)return a.online?-1:1;if(a.name===state.name)return -1;if(b.name===state.name)return 1;return String(a.name).localeCompare(String(b.name));});
  const online=rows.filter(p=>p.online);
  const html=rows.length?rows.map(p=>{const me=p.name===state.name, on=!!p.online;return `<div class="${on?'playerRowOnline':'playerRowOffline'} ${me?'playerMe':''}"><div><b>${on?'🟢':'🔴'} ${escapeHtml(p.name||'Player')}</b><div class="playerMeta">${me?'Du · ':''}${on?'Online':'Offline'}${!on&&p.lastSeen?` · zuletzt vor ${formatAgo(p.lastSeen)}`:''}</div></div><span class="statusDot ${on?'playerOnline':'playerOffline'}">${on?'ONLINE':'OFFLINE'}</span></div>`;}).join(''):'<div class="card">Noch keine Spielerdaten vom Server.</div>';
  openModal(`<button class="close" onclick="closeModal()">✕</button><h2>👥 Spieler</h2><p class="muted">${online.length} online · ${rows.filter(p=>!p.online).length} offline</p>${html}<button class="secondary" onclick="closeModal()">Schließen</button>`);
}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function formatAgo(ts){const sec=Math.max(0,Math.floor((Date.now()-ts)/1000));if(sec<60)return sec+"s";const min=Math.floor(sec/60);if(min<60)return min+" Min.";return Math.floor(min/60)+" Std.";}
setInterval(()=>{sendPresence();},5000);

function boot(){
 scene=new THREE.Scene();scene.background=new THREE.Color(0x7fc8f0);scene.fog=new THREE.Fog(0x7fc8f0,85,230);
 camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,500);
 renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=state.settings.shadows;renderer.shadowMap.type=THREE.PCFSoftShadowMap;$("game").appendChild(renderer.domElement);
 clock=new THREE.Clock();
 scene.add(new THREE.HemisphereLight(0xbde7ff,0x35513c,2.0));
 const sun=new THREE.DirectionalLight(0xffffff,2.4);sun.position.set(35,80,20);sun.castShadow=true;sun.shadow.mapSize.set(1536,1536);scene.add(sun);
 buildWorld();buildPlayer();buildBase();bind();
 $("loading").style.opacity=0;setTimeout(()=>$("loading").remove(),550);
 $("menu").style.display="grid";$("menuName").value=state.name==="Player"?"":state.name;
 animate();
}
function material(c,rough=.86,metal=0){return new THREE.MeshStandardMaterial({color:c,roughness:rough,metalness:metal})}
function meshBox(x,y,z,s,c,cast=true){
 const m=new THREE.Mesh(new THREE.BoxGeometry(...s),material(c));m.position.set(x,y,z);m.castShadow=cast;m.receiveShadow=true;scene.add(m);world.push(m);return m
}
function cylinder(x,y,z,r,h,c){
 const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,18),material(c));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);world.push(m);return m
}
function label(text,scale=1){
 const c=document.createElement("canvas");c.width=640;c.height=150;const x=c.getContext("2d");
 x.fillStyle="rgba(5,10,20,.78)";x.roundRect(10,22,620,106,24);x.fill();
 x.fillStyle="#fff";x.font="900 34px Arial";x.textAlign="center";x.fillText(text,320,87);
 const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthWrite:false}));s.scale.set(8*scale,1.9*scale,1);return s;
}
function buildWorld(){
 const g=meshBox(0,-1,0,[250,2,250],0x3f8c59,false);
 zones.forEach((z,i)=>{
  const [name,x,zz,color,req,icon]=z;
  meshBox(x,0,zz,[43,1.1,43],color,false);
  const sign=label(icon+" "+name+(state.level<req?"  ·  🔒 LV "+req:""),.9);sign.position.set(x,7,zz);scene.add(sign);
  // distinctive scenery
  for(let j=0;j<11;j++){
   const a=(j/11)*Math.PI*2+i*.7, r=12+(j%3)*2;
   const px=x+Math.cos(a)*r,pz=zz+Math.sin(a)*r;
   if(name==="Green Forest"){cylinder(px,2,pz,1,4,0x70432d);cylinder(px,5,pz,3,5,0x257c45)}
   else if(name==="Desert"){cylinder(px,1.3,pz,.9,2.6,0x8f6a43)}
   else if(name==="Volcano"){cylinder(px,1.5,pz,1.1,3,0x4b3d3b)}
   else if(name==="Space Zone"){const r1=cylinder(px,1,pz,1.3,2,0x515a91);r1.rotation.z=.4}
   else {cylinder(px,1,pz,.75,2,0x6b7077)}
  }
  if(name==="Ocean"){
   for(let j=0;j<9;j++){const w=new THREE.Mesh(new THREE.TorusGeometry(2.5,.08,8,24),material(0x8feeff));w.rotation.x=Math.PI/2;w.position.set(x-14+j*3,1.1,zz+7*Math.sin(j));scene.add(w)}
  }
 });
 // central plaza and roads
 const plaza=new THREE.Mesh(new THREE.CylinderGeometry(14,14,.4,48),material(0x243650));plaza.position.y=.2;plaza.receiveShadow=true;scene.add(plaza);
 for(let x=-110;x<=110;x+=10)meshBox(x,-.45,0,[7,.2,2.5],0xb49b78,false);
 // egg pedestals
 eggs.forEach((e,i)=>{
  const a=i/eggs.length*Math.PI*2;const x=Math.cos(a)*8,z=Math.sin(a)*8;
  meshBox(x,.5,z,[3,.8,3],0x1a2943);

 addEventListener("mousemove",e=>{if(state.settings.inputMode==="mobile")return;if(document.pointerLockElement===renderer.domElement)yaw-=e.movementX*.002});
 $("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
 // touch joystick
 const st=$("stick"),kn=$("knob");let active=false;
 const move=e=>{if(!active)return;const t=e.touches[0],r=st.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=t.clientX-cx,dy=t.clientY-cy,L=Math.hypot(dx,dy),max=48;if(L>max){dx=dx/L*max;dy=dy/L*max}joy.x=dx/max;joy.y=dy/max;kn.style.transform=`translate(${dx}px,${dy}px)`};
 st.addEventListener("touchstart",e=>{active=true;move(e)},{passive:true});st.addEventListener("touchmove",move,{passive:true});st.addEventListener("touchend",()=>{active=false;joy.x=joy.y=0;kn.style.transform=""});
 $("interact").addEventListener("touchstart",interact);$("run").addEventListener("touchstart",()=>keys.shift=true);$("run").addEventListener("touchend",()=>keys.shift=false);
}
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(.035,clock.getDelta());
 if(started){
  let mobileMode=state.settings.inputMode==="mobile"; let f=(mobileMode?0:(keys.w?-1:0)+(keys.s?1:0))+joy.y,r=(mobileMode?0:(keys.d?1:0)+(keys.a?-1:0))+joy.x;
  if(f||r){const L=Math.hypot(f,r)||1;f/=L;r/=L;const speed=7*(1+(state.speedLevel-1)*.1)*(keys.shift?1.5:1);player.position.x+=Math.sin(yaw)*f*speed*dt+Math.cos(yaw)*r*speed*dt;player.position.z+=Math.cos(yaw)*f*speed*dt-Math.sin(yaw)*r*speed*dt;player.rotation.y=Math.atan2(Math.sin(yaw)*f+Math.cos(yaw)*r,Math.cos(yaw)*f-Math.sin(yaw)*r)}
  player.position.x=Math.max(-118,Math.min(118,player.position.x));player.position.z=Math.max(-118,Math.min(118,player.position.z));
  const target=new THREE.Vector3(player.position.x-Math.sin(yaw)*11,player.position.y+6.5,player.position.z-Math.cos(yaw)*11);camera.position.lerp(target,.13);camera.lookAt(player.position.x,1.3,player.position.z);
 }
 eggObjects.forEach((e,i)=>{e.rotation.y+=dt*.45;e.position.y=2+Math.sin(performance.now()*.0015+i)*.12});
 pets3D.forEach((p,i)=>{p.position.y=.95+Math.sin(performance.now()*.002+i)*.08;p.rotation.y+=dt*.5});
 // particles
 for(let i=world.length-1;i>=0;i--){const o=world[i];if(o.userData?.life){o.userData.life-=dt;o.position.addScaledVector(o.userData.vel,dt);o.userData.vel.y-=8*dt;o.material.opacity=Math.max(0,o.userData.life);if(o.userData.life<=0){scene.remove(o);world.splice(i,1)}}}
 renderer.render(scene,camera);
}
setInterval(()=>{if(started){const inc=Math.max(1,income());state.coins+=inc;state.totalCoins+=inc;addXP(Math.max(1,Math.floor(inc/500)));save();ui();checkAchievements()}},1000);

boot();
applyInputMode();
connectPresence();
</script>
